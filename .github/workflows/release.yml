name: Build & Release

# Manual releases only: nothing happens on push. Run it from
# Actions -> Build & Release -> Run workflow, and it builds the app, bumps the
# version and publishes a GitHub Release with an auto-generated changelog and
# the APK attached.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Override the version (e.g. 6.6.0). Leave empty for auto v<major.minor>.<build number>.'
        required: false
        type: string

# Required so the workflow can create tags and releases.
permissions:
  contents: write

# Never let two releases race each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      # Optional: set these repository secrets to ship a signed release APK.
      # Without them the workflow falls back to an installable debug APK.
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags are required to diff against the previous release.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install SDK platform, build-tools, NDK and CMake
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" "platforms;android-33" "build-tools;34.0.0" "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ------------------------------------------------------------------
      # Version: derived from app/build.gradle, bumped on every run.
      # ------------------------------------------------------------------
      - name: Compute version
        id: version
        run: |
          set -euo pipefail

          BASE_NAME="$(grep -m1 -oP 'versionName\s+"\K[^"]+' app/build.gradle)"
          BASE_CODE="$(grep -m1 -oP 'versionCode\s+\K[0-9]+' app/build.gradle)"
          BASE_MAJOR_MINOR="${BASE_NAME%.*}"

          if [[ ! "$BASE_MAJOR_MINOR" =~ ^[0-9]+\.[0-9]+$ || ! "$BASE_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse versionName/versionCode from app/build.gradle (got '${BASE_NAME}' / '${BASE_CODE}')"
            exit 1
          fi

          OVERRIDE='${{ inputs.version }}'
          if [ -n "$OVERRIDE" ]; then
            VERSION_NAME="$OVERRIDE"
          else
            VERSION_NAME="${BASE_MAJOR_MINOR}.${{ github.run_number }}"
          fi

          # versionCode always grows, so installs upgrade cleanly.
          VERSION_CODE=$(( BASE_CODE + ${{ github.run_number }} ))
          TAG="v${VERSION_NAME}"

          # Stamp the built APK with the release version (CI-only edit).
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${VERSION_NAME}\"/" app/build.gradle

          {
            echo "name=${VERSION_NAME}"
            echo "code=${VERSION_CODE}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing ${TAG} (versionCode ${VERSION_CODE})" >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # Signing: repository secrets win, otherwise the keystore committed in
      # signing/ is used. See signing/README.md.
      # ------------------------------------------------------------------
      - name: Resolve signing config
        id: signing
        run: |
          set -euo pipefail
          ENV_FILE="$RUNNER_TEMP/signing.env"
          : > "$ENV_FILE"

          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            STORE_FILE="$RUNNER_TEMP/release.jks"
            STORE_PASSWORD="${SIGNING_STORE_PASSWORD:-}"
            KEY_ALIAS="${SIGNING_KEY_ALIAS:-}"
            KEY_PASSWORD="${SIGNING_KEY_PASSWORD:-}"
            SOURCE="repository secrets"
          elif [ -f signing/stryker-release.jks ] && [ -f signing/signing.properties ]; then
            STORE_FILE="$RUNNER_TEMP/release.jks"
            cp signing/stryker-release.jks "$STORE_FILE"
            STORE_PASSWORD="$(sed -n 's/^storePassword=//p' signing/signing.properties | head -1)"
            KEY_ALIAS="$(sed -n 's/^keyAlias=//p' signing/signing.properties | head -1)"
            KEY_PASSWORD="$(sed -n 's/^keyPassword=//p' signing/signing.properties | head -1)"
            SOURCE="the keystore in signing/"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing material found - building an unsigned debug APK."
            exit 0
          fi

          [ -s "$STORE_FILE" ] || { echo "::error::Keystore is missing or empty"; exit 1; }
          for v in STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::$v is empty - check signing/signing.properties"; exit 1; }
          done

          {
            echo "STRYKER_RELEASE_STORE_FILE=$STORE_FILE"
            echo "STRYKER_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "STRYKER_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "STRYKER_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$ENV_FILE"
          chmod 600 "$ENV_FILE"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Signing with ${SOURCE} (alias ${KEY_ALIAS})" >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # Build
      # ------------------------------------------------------------------
      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -a
          . "$RUNNER_TEMP/signing.env"
          set +a
          ./gradlew assembleRelease --stacktrace

      - name: Build debug APK (no signing material)
        if: steps.signing.outputs.signed != 'true'
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK signing certificate
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          [ ${#apks[@]} -gt 0 ] || { echo "::error::No release APK to verify"; exit 1; }
          APK="${apks[0]}"
          bt=("${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*)
          [ ${#bt[@]} -gt 0 ] || { echo "::error::No build-tools found"; exit 1; }
          BT="$(printf '%s\n' "${bt[@]}" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          grep -qi 'verified using v[0-9]' "$RUNNER_TEMP/apksigner.txt" \
            || { echo "::error::APK signature did not verify"; exit 1; }

      - name: Collect APKs
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist
          files=(app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::The build produced no APK"
            exit 1
          fi
          for f in "${files[@]}"; do
            kind="$(basename "$(dirname "$f")")"
            cp "$f" "dist/Stryker-${{ steps.version.outputs.name }}-${kind}.apk"
          done
          ls -lh dist

      # ------------------------------------------------------------------
      # Release notes + release
      # ------------------------------------------------------------------
      - name: Generate changelog
        env:
          NEW_TAG: ${{ steps.version.outputs.tag }}
        run: bash scripts/generate-changelog.sh changelog.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Stryker ${{ steps.version.outputs.name }}
          body_path: changelog.md
          files: dist/*.apk
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "## Released ${{ steps.version.outputs.tag }}"
            echo
            echo "versionCode: \`${{ steps.version.outputs.code }}\`"
            echo
            echo "Release page: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${{ steps.version.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"
